#  Nastavení projektu pro Cloudflare Pages.
#
#  Lokální spuštění:  npx wrangler pages dev
#  Databáze:          npx wrangler d1 execute ugustiku --local --file=schema.sql

name = "ugustiku"
compatibility_date = "2026-10-01"

# Složka se statickými soubory (CSS, JS, fotky, písma).
# Serverová část je ve složce functions/ – tu Cloudflare pozná sám.
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"             # takhle se na databázi saháme v kódu: env.DB
database_name = "ugustiku"
# database_id vypíše příkaz `npx wrangler d1 create ugustiku` – postup je
# v NASAZENI.md, krok 3. Pro lokální běh (--local) se nepoužívá, data jsou
# ve složce .wrangler/. Tajné to není, klidně může být v gitu.
database_id = "7c4f207c-c0dc-4667-bb18-ceb3bc6e6beb"
